<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Timekeeper</title>
    <meta name="theme-color" content="#0b1017" />
    <meta
      name="description"
      content="생각난 순간 던지면, 지금 할 수 있는 세 개만 남는 시간관리 앱"
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <script>
      // 첫 페인트 전에 밝기만 정한다 (깜빡임 방지).
      // 색·스케일은 React 가 useLayoutEffect 에서 토큰으로 심는다 — 여기서는 data-theme 하나뿐.
      (function () {
        try {
          var mode = null;
          var raw = localStorage.getItem('timekeeper.studio');
          if (raw) {
            var stored = JSON.parse(raw);
            if (stored && (stored.mode === 'light' || stored.mode === 'dark')) mode = stored.mode;
          }
          if (!mode) {
            mode = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = mode;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
